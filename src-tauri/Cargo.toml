[package]
name = "hoyo-last-play"
version = "0.1.0"
description = "Hoyo Last Play Activity Tracker"
authors = ["ardal"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"
chrono = "0.4"
winreg = "0.56"
rfd = "0.17.2"
